- insert:
    - id: sensory-memory
      name: '@local/sensory-memory'
      config:
        indexDir: !!js dshHomePath('sensory-index')
        indexScope: session
        journalCompactAfter: 2000
        trustedEvidenceTools: []
        userGlobalEnabled: true
        childTopK: 8
        childUnionLimit: 32
        parentEligibleLimit: 16
        parentSelectLimit: 6
        relativeScoreWindow: 0.20
        coverageLexicalMinimum: 0.35
        coverageDenseMinimum: 0.75
        coverageDenseMargin: 0.025
        lexicalGuaranteePerQuery: 4
        evidenceQualityThreshold: 0.80
        ambiguityMargin: 0.15
        vectorProvider: http
        vectorEndpoint: http://127.0.0.1:8765/embed
        vectorModel: intfloat/multilingual-e5-small
        vectorRevision: 614241f622f53c4eeff9890bdc4f31cfecc418b3
        vectorDimensions: 384
        vectorBatchSize: 32
        vectorTimeoutMs: 15000
        vectorRequired: false
        vectorCandidateThreshold: 0.18
        vectorLowConfidenceFloor: 0.50
        parentTargetTokens: 2048
        parentMaxTokens: 3072
        parentMinTokens: 512
        childTargetTokens: 384
        childMaxTokens: 512
        childOverlapTokens: 64
        workingInactiveTurns: 4
        semiAssociationTurns: 8
        semiAssociationCount: 2
        bankAssociationCount: 3
        bankSessionCount: 2
        semiInactiveWorkspaceTurns: 12
        semiInactiveHours: 24
        semiActivationFloor: -1.5
        contextPressureRatio: 0.65
        contextPressureTargetRatio: 0.55
        semipersistentBudgetRatio: 0.20
        parentEvidenceBudgetRatio: 0.45
        transitionWaitMs: 5000
        llmProvider: opencode-go
        llmModel: deepseek-v4-flash
        llmReasoningEffort: high
        cleanupLegacyOnStart: false
