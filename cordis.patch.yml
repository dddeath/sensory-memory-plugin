- insert:
    - id: sensory-memory
      name: '@local/sensory-memory'
      config:
        indexDir: !!js dshHomePath('sensory-index')
        indexScope: session
        journalCompactAfter: 2000
        trustedEvidenceTools: []
        userGlobalEnabled: true
        candidateLimit: 32
        evidenceCatalogLimit: 3
        relevanceThreshold: 0.70
        evidenceQualityThreshold: 0.80
        ambiguityMargin: 0.15
        vectorProvider: feature-hash
        vectorDimensions: 384
        vectorCandidateThreshold: 0.18
        plannerCandidateFloor: 0.45
        chunkTargetTokens: 320
        chunkMaxTokens: 448
        chunkOverlapTokens: 48
        workingInactiveTurns: 4
        semiAssociationTurns: 8
        semiAssociationCount: 2
        bankAssociationCount: 3
        bankSessionCount: 2
        semiInactiveWorkspaceTurns: 12
        semiInactiveHours: 24
        semiActivationFloor: -1.5
        contextPressureRatio: 0.65
        contextPressureTargetRatio: 0.55
        semipersistentBudgetRatio: 0.20
        transitionWaitMs: 5000
        llmProvider: opencode-go
        llmModel: deepseek-v4-flash
        llmReasoningEffort: high
        cleanupLegacyOnStart: false
